<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyDJDAeuom8ynSHkbOfCM4g4ZpXg1an2OOI",
    authDomain:        "vkzz-tracker.firebaseapp.com",
    projectId:         "vkzz-tracker",
    storageBucket:     "vkzz-tracker.firebasestorage.app",
    messagingSenderId: "113351713339",
    appId:             "1:113351713339:web:1ae9ba86b732237236b21e",
  });
  const auth = firebase.auth();
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('userLabel').textContent = user.displayName || user.email;
      document.getElementById('logoutBtn').style.display = 'inline-block';
      document.getElementById('loginBtn').style.display  = 'none';
    } else {
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('loginBtn').style.display  = 'inline-block';
    }
    document.getElementById('authBar').style.display = 'flex';
  });
  function _signOut() { auth.signOut(); }
</script>
<style>
  :root {
    --bg:      #0f1117;
    --bg2:     #1a1d27;
    --bg3:     #22263a;
    --border:  #2e3350;
    --accent:  #4f8ef7;
    --green:   #34d399;
    --red:     #f87171;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --radius:  10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 15px; }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  #authBar { display: none; align-items: center; gap: 12px; }
  #userLabel { font-size: 0.85rem; color: var(--muted); }
  .logout-btn {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all .15s;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 28px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 8px; }
  .filter-group label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .sport-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    cursor: pointer;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.82rem;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--muted);
    transition: all .15s;
    user-select: none;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:hover:not(.active) { border-color: var(--accent); color: var(--text); }

  select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 7px 12px;
    font-size: 0.88rem;
    cursor: pointer;
    outline: none;
    min-width: 160px;
  }
  select:focus { border-color: var(--accent); }

  /* Stats cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .card .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em; }
  .card .sub   { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--text); }

  /* Chart */
  .chart-wrap {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 28px;
  }
  .chart-wrap h2 { font-size: 0.9rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.06em; }
  .chart-wrap canvas { max-height: 240px; }

  .empty { text-align: center; color: var(--muted); padding: 48px; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:24px">
    <h1>VkZz</h1>
    <nav style="display:flex;gap:20px">
      <a href="index.html" style="color:var(--accent);text-decoration:none;font-size:.88rem">Tulokset</a>
      <a href="tips.html"  style="color:var(--muted);text-decoration:none;font-size:.88rem">Vihjeet</a>
    </nav>
  </div>
  <div id="authBar">
    <span id="userLabel"></span>
    <button class="logout-btn" id="loginBtn" onclick="window.location.href='login.html'" style="display:none">Kirjaudu</button>
    <button class="logout-btn" id="logoutBtn" onclick="_signOut()" style="display:none">Kirjaudu ulos</button>
  </div>
</header>

<div class="container">

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label>Laji</label>
      <div class="sport-chips" id="sportChips"></div>
    </div>
    <div class="filter-group">
      <label>Ajanjakso</label>
      <select id="monthSelect">
        <option value="all">Kaikki</option>
      </select>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="card">
      <div class="label">Vedot</div>
      <div class="value neu" id="statCount">—</div>
    </div>
    <div class="card">
      <div class="label">ROI</div>
      <div class="value" id="statROI">—</div>
    </div>
    <div class="card">
      <div class="label">P/L (u)</div>
      <div class="value" id="statPL">—</div>
    </div>
    <div class="card">
      <div class="label">Avg kerroin</div>
      <div class="value neu" id="statOdds">—</div>
      <div class="sub" id="statOddsMed"></div>
    </div>
    <div class="card">
      <div class="label">Record</div>
      <div class="value neu" id="statRecord">—</div>
      <div class="sub" id="statRecordSub"></div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-wrap">
    <h2>Kuukausittainen P/L (u)</h2>
    <canvas id="plChart"></canvas>
  </div>

</div>

<script>
let ALL_BETS = [];
let ALL_SPORTS = [];
let ALL_MONTHS = [];
let chart = null;

let activeSport = 'all';
let activeMonth = 'all';

fetch('data.json')
  .then(r => r.json())
  .then(data => {
    ALL_BETS   = data.bets;
    ALL_SPORTS = data.sports;
    ALL_MONTHS = data.months;
    init();
  })
  .catch(() => {
    document.querySelector('.container').innerHTML =
      '<div class="empty">data.json ei löydy.</div>';
  });

function init() {
  const chips = document.getElementById('sportChips');

  // "Kaikki" chip
  const all = document.createElement('span');
  all.className = 'chip active';
  all.textContent = 'Kaikki';
  all.dataset.sport = 'all';
  all.onclick = () => selectSport('all');
  chips.appendChild(all);

  // Per-sport chips
  ALL_SPORTS.forEach(s => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.textContent = s;
    el.dataset.sport = s;
    el.onclick = () => selectSport(s);
    chips.appendChild(el);
  });

  // Month select
  const sel = document.getElementById('monthSelect');
  ALL_MONTHS.slice().reverse().forEach(ym => {
    const opt = document.createElement('option');
    opt.value = ym;
    const [y, m] = ym.split('-');
    const mn = ['','Tammikuu','Helmikuu','Maaliskuu','Huhtikuu','Toukokuu','Kesäkuu',
                 'Heinäkuu','Elokuu','Syyskuu','Lokakuu','Marraskuu','Joulukuu'];
    opt.textContent = `${y} ${mn[parseInt(m)]}`;
    sel.appendChild(opt);
  });
  sel.onchange = () => { activeMonth = sel.value; update(); };

  update();
}

function selectSport(sport) {
  activeSport = sport;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.sport === sport);
  });
  update();
}

function filtered() {
  return ALL_BETS.filter(b =>
    (activeSport === 'all' || b.sport === activeSport) &&
    (activeMonth === 'all' || b.ym === activeMonth)
  );
}

function fmt(n, decimals=2) {
  return n.toFixed(decimals).replace('.', ',');
}

function update() {
  const bets = filtered();

  if (bets.length === 0) {
    document.getElementById('statCount').textContent     = '0';
    document.getElementById('statROI').textContent      = '—';
    document.getElementById('statROI').className        = 'value neu';
    document.getElementById('statPL').textContent       = '—';
    document.getElementById('statPL').className         = 'value neu';
    document.getElementById('statOdds').textContent     = '—';
    document.getElementById('statOddsMed').textContent  = '';
    document.getElementById('statRecord').textContent   = '—';
    document.getElementById('statRecordSub').textContent = '';
    updateChart([]);
    return;
  }

  const totalPL    = bets.reduce((s, b) => s + b.pl, 0);
  const totalStake = bets.reduce((s, b) => s + b.stake, 0);
  const roi        = totalStake > 0 ? (totalPL / totalStake) * 100 : 0;
  const avgOdds    = bets.reduce((s, b) => s + b.odds, 0) / bets.length;
  const sortedOdds = bets.map(b => b.odds).sort((a, b) => a - b);
  const medOdds    = sortedOdds[Math.floor(sortedOdds.length / 2)];
  const wins   = bets.filter(b => b.result === 'W').length;
  const losses = bets.filter(b => b.result === 'L').length;
  const pushes = bets.filter(b => b.result === 'P').length;
  const winPct = wins / (wins + losses) * 100;

  const plEl = document.getElementById('statPL');
  plEl.textContent = (totalPL >= 0 ? '+' : '') + fmt(totalPL) + 'u';
  plEl.className = 'value ' + (totalPL >= 0 ? 'pos' : 'neg');

  const roiEl = document.getElementById('statROI');
  roiEl.textContent = (roi >= 0 ? '+' : '') + fmt(roi) + '%';
  roiEl.className = 'value ' + (roi >= 0 ? 'pos' : 'neg');

  document.getElementById('statCount').textContent     = bets.length.toLocaleString('fi');
  document.getElementById('statOdds').textContent      = fmt(avgOdds);
  document.getElementById('statOddsMed').textContent   = `mediaani ${fmt(medOdds)}`;
  document.getElementById('statRecord').textContent    = `${wins}–${pushes}–${losses}`;
  document.getElementById('statRecordSub').textContent = `${fmt(winPct, 1)}% voittoaste`;

  const monthMap = {};
  (activeMonth === 'all' ? ALL_MONTHS : [activeMonth]).forEach(ym => monthMap[ym] = 0);
  bets.forEach(b => { if (monthMap[b.ym] !== undefined) monthMap[b.ym] += b.pl; });
  updateChart(Object.entries(monthMap));
}

function updateChart(entries) {
  const labels  = entries.map(([ym]) => {
    const [y, m] = ym.split('-');
    const mn = ['','Tam','Hel','Maa','Huh','Tou','Kes','Hei','Elo','Syy','Lok','Mar','Jou'][parseInt(m)];
    return `${mn} ${y.slice(2)}`;
  });
  const values  = entries.map(([, v]) => parseFloat(v.toFixed(4)));
  const colors  = values.map(v => v >= 0 ? '#34d39966' : '#f8717166');
  const borders = values.map(v => v >= 0 ? '#34d399' : '#f87171');

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets[0].data            = values;
    chart.data.datasets[0].backgroundColor = colors;
    chart.data.datasets[0].borderColor     = borders;
    chart.update();
    return;
  }

  const ctx = document.getElementById('plChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: borders, borderWidth: 1.5, borderRadius: 4 }] },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => (c.parsed.y >= 0 ? '+' : '') + c.parsed.y.toFixed(2).replace('.', ',') + 'u' } }
      },
      scales: {
        x: { grid: { color: '#2e3350' }, ticks: { color: '#64748b', font: { size: 11 } } },
        y: { grid: { color: '#2e3350' }, ticks: { color: '#64748b', font: { size: 11 }, callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + 'u' } }
      }
    }
  });
}
</script>
</body>
</html>
